<script>
'use strict';
const data=__DATA__;
const symbols=['SINI','BRPT','TPIA','BREN'];
const state={layout:'page',page:'ticker',scan:'report',ticker:'SINI',tab:'brokers',from:'2026-07-29',through:'2026-10-22',cursor:null,compare:false,reportMode:'all',reportTicker:'all',stockQuery:'',stockSort:'ticker',stockDirection:1,ownershipView:'five',marketFilter:'all',brokerUnit:'shares',brokerCodes:['XL','PD','CC'],brokerSearch:'',brokerSort:'net',brokerDirection:-1,brokerSelectedOnly:false};
const f=(n,d=0)=>n===null||n===undefined?'Not reported':new Intl.NumberFormat('en-US',{maximumFractionDigits:d,minimumFractionDigits:d}).format(n);
const compact=n=>n===null||n===undefined?'Not reported':Math.abs(n)>=1e9?f(n/1e9,2)+'B':Math.abs(n)>=1e6?f(n/1e6,2)+'M':Math.abs(n)>=1e3?f(n/1e3,1)+'K':f(n);
const sign=n=>n===null||n===undefined?'Not reported':(n>0?'+':'')+compact(n);
const percent=n=>n===null||n===undefined?'Not reported':(n>0?'+':'')+f(n,2)+'%';
const tone=n=>n===null||n===undefined?'subtle':n>=0?'up':'down';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=d=>d?new Date(d.slice(0,10)+'T12:00:00Z').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}):'Not reported';
const detail=()=>data.details[state.ticker];
const selectedRows=()=>detail().prices.filter(r=>r.date>=state.from&&r.date<=state.through);
const cursorRow=()=>{const rows=selectedRows();return rows[Math.min(state.cursor??rows.length-1,rows.length-1)]};
const asof=()=>cursorRow()?.date;
const table=(headers,rows,cls='')=>`<div class="data-table"><table class="${cls}"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">No records in this view.</td></tr>`}</tbody></table></div>`;
const link=t=>`<button class="ticker-link" data-action="ticker" data-ticker="${t}">${t}</button>`;
const source=(label,key)=>`<div class="source-foot"><span>${label}</span><button data-action="source" data-source="${key}">View source</button></div>`;
const missing=(title,text,extra='')=>`<div class="empty-box"><h4>${title}</h4><p>${text}</p>${extra?`<p class="meta">${extra}</p>`:''}</div>`;
function metrics(items){return `<div class="metrics">${items.map(([label,value,note,cls])=>`<div><label>${label}</label><strong class="${cls||''}">${value}</strong>${note?`<small>${note}</small>`:''}</div>`).join('')}</div>`}
function sampleLinks(){return `<div class="sample-tickers"><span>Research examples</span>${symbols.map(t=>`<button data-action="ticker" data-ticker="${t}" aria-pressed="${state.ticker===t}">${t}</button>`).join('')}</div>`}
function heading(){return `<div class="prototype-tools"><p><strong>Production-based prototype.</strong> Compare two ways to connect the existing pages.</p><div class="variant-switch"><button data-action="layout" data-layout="page" aria-pressed="${state.layout==='page'}">A · Ticker page</button><button data-action="layout" data-layout="split" aria-pressed="${state.layout==='split'}">B · Beside the scan</button></div></div><header class="topbar"><div><p class="eyebrow">IDX anomaly radar</p><h1>Vibe IDX</h1></div><div class="status-strip" aria-label="Source dates">${[['Prices',data.health.prices],['IHSG',data.health.indices],['5% ownership',data.health.five_pct],['Issuers',data.health.issuers]].map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('')}</div></header><nav class="surface-nav" aria-label="Main pages">${[['radar','Radar','Daily signals across the market.'],['stocks','Stocks','Prices, volume and foreign flows.'],['report','5% report','Read ownership accounts and changes.']].map(([id,label,desc])=>`<button class="surface-tab" data-action="page" data-page="${id}" ${((state.layout==='split'?state.scan:state.page)===id)?'aria-current="page"':''}><span>${label}</span><small>${desc}</small></button>`).join('')}</nav>`}
function rangeToolbar(){
 const rows=selectedRows(),n=Math.min(state.cursor??rows.length-1,rows.length-1);
 return `<div class="range-toolbar"><div class="date-fields"><label>From <input aria-label="Price range start" data-field="from" type="date" value="${state.from}" min="${detail().prices[0].date}" max="${state.through}"></label><label>Through <input aria-label="Price range end" data-field="through" type="date" value="${state.through}" min="${state.from}" max="${detail().prices.at(-1).date}"></label><select data-field="preset" aria-label="Price range preset"><option value="custom">Choose range</option><option value="20">Last 20 sessions</option><option value="60">Last 60 sessions</option><option value="all">All available</option></select></div><div class="cursor-fields"><label for="price-cursor">Inspect</label><input id="price-cursor" data-field="cursor" type="range" min="0" max="${Math.max(0,rows.length-1)}" value="${Math.max(0,n)}" ${rows.length?'':'disabled'}><output for="price-cursor">${rows.length?date(rows[n].date):'No sessions'}</output></div></div>`;
}
function chart(){
 let rows=selectedRows();const inspected=cursorRow(),marketByDate=new Map(data.market.history.map(r=>[r.date,r]));
 if(state.compare)rows=rows.filter(r=>marketByDate.has(r.date));
 if(!rows.length)return missing('No chart records in this range.','Choose a range within the available source dates. IHSG comparison uses dates present in both sources.');
 const w=innerWidth<720?Math.max(260,innerWidth-110):760,h=220,left=8,right=58,top=14,bottom=27,pw=w-left-right,ph=h-top-bottom;
 const initial=rows[0],values=rows.map(r=>state.compare?(r.close/initial.close-1)*100:r.close);
 const indexValues=state.compare?rows.map(r=>(marketByDate.get(r.date).close/marketByDate.get(initial.date).close-1)*100):[];
 const all=[...values,...indexValues],lo=Math.min(...all),hi=Math.max(...all),padding=(hi-lo||1)*.08,min=lo-padding,max=hi+padding;
 const x=i=>left+i/(rows.length-1||1)*pw,y=n=>top+(max-n)/(max-min)*ph;
 const path=vals=>vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 const cursor=rows.findIndex(r=>r.date===inspected?.date),volumeMax=Math.max(...rows.map(r=>r.volume));
 const grid=Array.from({length:4},(_,i)=>{const n=min+(max-min)*i/3;return `<line x1="${left}" x2="${w-right}" y1="${y(n)}" y2="${y(n)}" stroke="#d5ddd8" stroke-dasharray="3 4"/><text x="${w-right+8}" y="${y(n)+3}">${state.compare?f(n,1)+'%':compact(n)}</text>`}).join('');
 return `<figure class="chart-figure"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${state.ticker} closing price history${state.compare?' compared with IHSG':''}">${grid}<polyline points="${path(values)}" fill="none" stroke="#123c35" stroke-width="2"/>${indexValues.length?`<polyline points="${path(indexValues)}" fill="none" stroke="#82938a" stroke-width="1.7" stroke-dasharray="5 4"/>`:''}${cursor>=0?`<line x1="${x(cursor)}" x2="${x(cursor)}" y1="${top}" y2="${h-bottom}" stroke="#76aab6" stroke-dasharray="3 3"/><circle cx="${x(cursor)}" cy="${y(values[cursor])}" r="3.5" fill="#123c35"/>`:''}${[...new Set([0,Math.floor(rows.length/2),rows.length-1])].map(i=>`<text x="${x(i)}" y="${h-4}" text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}">${date(rows[i].date).slice(0,6)}</text>`).join('')}</svg><svg class="volume-chart" viewBox="0 0 ${w} 65" role="img" aria-label="${state.ticker} daily share volume">${rows.map((r,i)=>`<rect x="${x(i)-Math.max(1,pw/rows.length*.27)}" y="${55-r.volume/volumeMax*45}" width="${Math.max(1.5,pw/rows.length*.54)}" height="${r.volume/volumeMax*45}" fill="${i&&r.close<rows[i-1].close?'#c8a39c':'#8eafa0'}"/>`).join('')}<text x="${w-right+8}" y="17">${compact(volumeMax)}</text><text x="${left}" y="65">Volume · shares</text></svg><figcaption><span>${rows[0].date} to ${rows.at(-1).date}</span><span>${state.compare?'Both series rebased to the first common date':'Close range '+f(lo)+' to '+f(hi)}</span></figcaption></figure>`;
}
function priceCard(){

function brokerContext(){

 const byDate=new Map(pack.days.map(([day,rows])=>[day,rows]));

 const through=asof();

 for(const day of inspected)for(const [code,buy,sell,buyValue,sellValue] of byDate.get(day)||[]){

function research(){
 const d=detail(),r=cursorRow(),all=d.prices,index=r?all.indexOf(r):-1,prev=all[index-1],change=prev?(r.close/prev.close-1)*100:null;
 return `<section class="research-pane"><div class="return-link"><button class="text-link" data-action="back">${state.layout==='split'?'Focus':'← Back to'} ${state.scan==='report'?'5% report':state.scan==='stocks'?'Stocks':'Radar'}</button><a href="https://vibe-idx.vercel.app/t/${state.ticker}" target="_blank" rel="noopener noreferrer">Current production page ↗</a></div>${sampleLinks()}<div class="surface-heading compact"><div><p class="eyebrow">${state.ticker} · research</p><h2>${esc(d.name)}</h2></div><p class="quote">${r?'Rp '+f(r.close):'No session'}<span class="${tone(change)}"> ${r?percent(change):''}</span><small>${r?date(r.date):'Choose a trading-date range'}</small></p></div>${rangeToolbar()}<nav class="tabs" role="tablist" aria-label="Ticker research">${[['overview','Overview'],['technical','Price & volume'],['brokers','Brokers'],['ownership','Ownership'],['company','Company & news'],['sources','Sources & trading day']].map(([id,label])=>`<button role="tab" aria-selected="${state.tab===id}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</nav>${!selectedRows().length&&['overview','technical'].includes(state.tab)?missing('No price sessions in this range.','The captured price history starts '+d.prices[0].date+' and ends '+d.prices.at(-1).date+'. No session has been substituted.'):state.tab==='overview'?`<div class="context-grid"><div class="stack">${priceCard()}${brokerCard()}</div><div class="stack">${holderSummary()}${ownershipCoverage()}<section class="card"><div class="card-head"><div><h3>Company context</h3><p>${esc(data.profiles.find(p=>p.ticker===state.ticker).sector)}</p></div><button class="text-link" data-action="tab" data-tab="company">Open company & news</button></div><p class="meta">${data.news[state.ticker].items.length} fetched news results. Source-backed company profile and holder references.</p></section></div></div>`:state.tab==='technical'?`<div class="stack">${priceCard()}${historyCard()}</div>`:state.tab==='brokers'?brokerCard(true):state.tab==='ownership'?ownership():state.tab==='company'?company():coverage()}</section>`;
}
function report(){
 const groups=data.five.groups.filter(g=>state.reportTicker==='all'||g.holding.ticker===state.reportTicker);
 const rows=groups.flatMap(g=>g.accounts.map((a,i)=>({ticker:g.holding.ticker,investor:g.holding.investorName,...a,percent:g.holding.percent,first:i===0}))).filter(r=>state.reportMode==='all'||r.change!==0);
 return `<section class="scan-panel"><div class="surface-heading"><div><p class="eyebrow">Ownership · ${data.five.asOf}</p><h2>5% report</h2></div><p>Read the source accounts. Open a ticker to inspect price, ownership and company context.</p></div><div class="filter-buttons"><button class="small-button ${state.reportMode==='all'?'selected':''}" data-action="report-mode" data-mode="all">All accounts</button><button class="small-button ${state.reportMode==='changed'?'selected':''}" data-action="report-mode" data-mode="changed">Changed accounts</button><select aria-label="Filter report ticker" data-field="reportTicker"><option value="all">All four examples</option>${symbols.map(t=>`<option ${state.reportTicker===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="scope-line"><span><i class="blue-key"></i>Blue rows have a reported share change.</span><span>${rows.length} account rows</span></div>${table(['Ticker / investor','Account holder','Before shares','After shares','Δ shares'],rows.map(r=>`<tr class="${r.change!==0?'changed':''}"><td>${link(r.ticker)}<div class="inline-meta">${esc(r.investor)}</div></td><td>${esc(r.holderName)}<div class="inline-meta">${esc(r.accountName)}</div></td><td class="numeric hide-in-split">${f(r.previousShares)}</td><td class="numeric">${f(r.currentShares)}</td><td class="numeric ${tone(r.change)}">${sign(r.change)}</td></tr>`))}<p class="hint">These four examples have no account-level changes in the 21 Oct workbook. No anomaly has been invented. The full production Radar has changes in other tickers.</p>${source('IDX 5% workbook · '+data.five.previousDate+' compared with '+data.five.asOf+'.','report')}<div class="actions" style="margin-top:14px"><button class="text-link" data-action="page" data-page="stocks">Open stock summary</button><a class="text-link" href="https://vibe-idx.vercel.app/" target="_blank" rel="noopener noreferrer">Full production Radar ↗</a></div></section>`;
}
function stocks(){
 let rows=data.tickers.filter(r=>(r.ticker+' '+r.name).toLowerCase().includes(state.stockQuery.toLowerCase()));
 rows.sort((a,b)=>typeof a[state.stockSort]==='string'?a[state.stockSort].localeCompare(b[state.stockSort])*state.stockDirection:(a[state.stockSort]-b[state.stockSort])*state.stockDirection);
 return `<section class="scan-panel"><div class="surface-heading"><div><p class="eyebrow">Market · ${data.health.prices}</p><h2>Stocks</h2></div><p>The production table, scoped to the four examples. Select a ticker to research it.</p></div><div class="filter-buttons"><input aria-label="Filter stocks" data-field="stockQuery" placeholder="Ticker or company name" value="${esc(state.stockQuery)}"></div><p class="meta">${rows.length} stocks. Column headings sort the table.</p>${table([['ticker','Ticker'],['close','Close'],['change_pct','Change'],['volume','Volume'],['value','Value'],['net_foreign','Net foreign · est.']].map(([id,title])=>`<button data-action="sort" data-sort="${id}">${title}${state.stockSort===id?(state.stockDirection>0?' ↑':' ↓'):''}</button>`),rows.map(r=>`<tr><td>${link(r.ticker)}<div class="inline-meta">${esc(r.name)}</div></td><td class="numeric">${f(r.close)}</td><td class="numeric ${tone(r.change_pct)}">${percent(r.change_pct)}</td><td class="numeric">${compact(r.volume)}</td><td class="numeric hide-in-split">${compact(r.value)}</td><td class="numeric hide-in-split ${tone(r.net_foreign)}">${sign(r.net_foreign)}</td></tr>`))}${source('Captured production stock summary. All values retain their source date.','stocks')}</section>`;
}
function radar(){
 const latest=data.market.history.at(-1),groups=[['five_pct_change','5% ownership changes'],['volume_spike','Volume spikes'],['ara','ARA moves'],['foreign_streak','Foreign buying streaks'],['green_on_red','Green on red']];
 return `<section class="scan-panel"><div class="surface-heading"><div><p class="eyebrow">Radar · ${data.market.date}</p><h2>IHSG ${f(latest.close,3)}</h2></div><p><strong class="${tone(latest.change_pct)}">${percent(latest.change_pct)}</strong> · ${data.market.up} up · ${data.market.down} down.</p></div><p class="rule">Ownership comes first in this variant. The market signals retain the production rules and source counts.</p>${sampleLinks()}<div class="filter-buttons">${[['all','All signals'],['five_pct_change','5% changes'],['volume_spike','Volume'],['ara','ARA'],['green_on_red','Green on red']].map(([id,title])=>`<button class="small-button ${state.marketFilter===id?'selected':''}" data-action="market-filter" data-filter="${id}">${title}</button>`).join('')}</div>${groups.filter(([id])=>state.marketFilter==='all'||state.marketFilter===id).map(([id,title])=>{const rows=data.feed.filter(r=>r.kind===id);return `<section class="feed-group"><h3>${title} <span class="row-badge">${rows.length}</span></h3><p class="rule">${id==='five_pct_change'?'Read the latest reported changes. The four research examples have no signal in this snapshot.':'Source observations from the existing production feed.'}</p>${rows.length?table(['Ticker','Date','Observation'],rows.slice(0,state.layout==='split'?4:8).map(r=>`<tr><td>${symbols.includes(r.ticker)?link(r.ticker):`<a href="https://vibe-idx.vercel.app/t/${r.ticker}" target="_blank" rel="noopener noreferrer">${r.ticker} ↗</a>`}</td><td>${r.date}</td><td>${id==='five_pct_change'?`${esc(r.numbers.investor)}<div class="inline-meta">${r.numbers.pct_after===null?'Next matching holding not reported':f(r.numbers.pct_before,2)+'% to '+f(r.numbers.pct_after,2)+'%'}</div>`:id==='volume_spike'?f(r.numbers.multiple,2)+'× volume':id==='ara'?percent(r.numbers.change_pct):id==='green_on_red'?percent(r.numbers.change_pct)+' vs IHSG '+percent(r.numbers.market_change_pct):r.numbers.streak_days+' trading days'}</td></tr>`)):'<p class="query-state">No signals in this group.</p>'}${rows.length>8?`<p class="meta">Showing ${state.layout==='split'?4:8} of ${rows.length}. <a href="https://vibe-idx.vercel.app/" target="_blank" rel="noopener noreferrer">Read the full production feed ↗</a></p>`:''}</section>`}).join('')}${source('Production Radar feed. Tickers outside the four examples open the production page.','radar')}</section>`;
}
function render(){
 const scan=state.layout==='split'?state.scan:state.page;
 const scanPage={radar,stocks,report}[scan];
 const content=state.layout==='split'?`<div class="split-layout">${(scanPage||report)()}${research()}</div>`:state.page==='ticker'?research():(scanPage||radar)();
 document.getElementById('app').innerHTML=`<main class="app-shell">${heading()}<div class="prototype-notice"><p>Captured production data and dated IDX files for SINI, BRPT, TPIA and BREN. Broker summaries captured for 60 sessions through 22 Oct 2026. Missing sources stay visible.</p></div><section class="workspace-panel">${content}</section><footer class="prototype-footer"><span>Throwaway design prototype. Production was not deployed or changed.</span><button class="text-link" data-action="source" data-source="decision">What changed from production?</button></footer></main>`;
}
function showSource(key){
 const sourceMap={prices:['Prices and volume',`Production ticker JSON for ${state.ticker}.\nCoverage: ${detail().prices[0].date} to ${detail().prices.at(-1).date}.\nFields: date, close, volume, value, net_foreign.\nOHLC is absent from this public export.\nNet foreign is estimated by the current pipeline as net foreign shares times close.`,`https://vibe-idx.vercel.app/data/ticker/${state.ticker}.json`],five:['Reported 5% holdings',`Production ownership snapshot ${data.health.five_pct}.\nThis is a report of disclosed holdings.\nIt is not a full ownership or ultimate-owner map.`,`https://vibe-idx.vercel.app/data/ticker/${state.ticker}.json`],changes:['Ownership history',`Some historical records have null after-values.\nNames can change between files. A missing exact-name match does not prove a sale.\nThe prototype displays those fields as not reported.`,`https://vibe-idx.vercel.app/data/ticker/${state.ticker}.json`],ownership:['Ownership source files',`Daily workbook: ownership-5pct-2026-10-21.xlsx\nSnapshot ${data.five.asOf}; comparison ${data.five.previousDate}.\nMonthly workbook: ownership-1pct-2026-02.xlsx\nMonthly snapshot 2026-02-27.\nBoth are existing repository fixtures parsed with the project's parsers.\nThe 1% complement is an arithmetic remainder, not verified float.`,null],report:['5% report accounts',`Parsed with the existing parseFivePct function.\nWorkbook: ownership-5pct-2026-10-21.xlsx.\nFields include investor, registered account, holder name, before and after shares.\nThe four selected examples have no changed accounts on this day.`,null],company:['Company profile',`Existing company-profiles.json fixture from IDX.\nFields include listing board, sector, industry, business, website and registrar.\nCapture date is not supplied.\nNo invented family, group or broker identity has been added.`,null],news:['News results',`RSS query: ${state.ticker} saham.\nFetched ${data.capturedAt}.\nDates and publisher names come from the RSS items.\nHeadlines can be incomplete or irrelevant and are not verified company disclosures.`,data.news[state.ticker].url],stocks:['Stock summary',`Captured production stock table dated ${data.health.prices}.\nFiltered to four examples. No values have been synthesized.\nThe prototype sorts and filters the captured rows.`,`https://vibe-idx.vercel.app/data/tickers.json`],radar:['Radar feed',`Captured production feed.\nCurrent rules and observations retained.\n5% ownership changes moved ahead of market signals.\nNone of the four research examples appears in the latest signal feed.`,`https://vibe-idx.vercel.app/data/feed.json`],brokers:['Broker summary and inventory',`Source: Exodus /marketdetectors/${state.ticker}.\nGross transactions, all boards, all investor types, limit 200.\nCaptured coverage: ${data.brokers[state.ticker]?.from} to ${data.brokers[state.ticker]?.through}.\nFetched: ${data.brokers[state.ticker]?.fetchedAt}.\nEvery session checked against the price calendar and reported broker counts.\nShares reconcile with lots × 100 after normalizing source float artifacts below 0.000001 share.\nBoth gross sides balance. Every broker’s daily sums match the range response.\nCurves sum buy minus sell since the selected baseline, starting from zero. This does not establish actual holdings, investor identities or remaining-position cost.\nCaptured snapshots contain no auth headers or tokens.`,null],probes:['Endpoint checks',`Daily broker summaries: HTTP 200 for SINI, BRPT, TPIA and BREN.\n60 sessions plus one range response per ticker.\nCoverage: 29 Jul to 22 Oct 2026.\nDaily shares and values reconcile with range totals.\nEarlier intraday and historical-queue probes returned HTTP 401 with the old session. Those probes do not establish feature availability.\nNo live feed or replay is connected.`,null],trading:['Trading-day tools',`Stockbit documents live Running Trade and Order Queue.\nA historical broker-flow chart is different from live broker attribution.\nThis run did not verify historical order-book replay.\nNo simulated tape is included.`,`https://help.stockbit.com/id/article/fitur-running-trade-bagaimana-cara-akses-dan-apa-fungsinya-a709zr/`],decision:['Changes from production',`Retained: palette, typography, large heading, freshness strip, Radar, Stocks and white tables.\nAdded: a direct 5% report, four example links, ticker research tabs, volume bars, range inspection, broker inventory and source coverage.\nVariant A keeps the ticker as its own page.\nVariant B retains the scan beside ticker detail on wide screens.\nThe default recommendation is A for its smaller change to production.\nNo notes, labels, screening stages or pass/fail scores.\nNo credentials or private auth files are embedded.`,null]};
 const [title,body,url]=sourceMap[key]||sourceMap.decision;document.getElementById('source-title').textContent=title;document.getElementById('source-content').innerHTML=`<pre>${esc(body)}</pre>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open the source ↗</a>`:''}<p>Public responses and existing fixtures were captured for this throwaway prototype. No live feed is connected.</p>`;document.getElementById('source-dialog').showModal();
}
function chooseTicker(ticker){state.ticker=ticker;state.page='ticker';state.cursor=null;const first=detail().prices[0].date,last=detail().prices.at(-1).date;if(state.from<first)state.from=first;if(state.through>last)state.through=last}
function action(event){
 const button=event.target.closest('[data-action]');if(!button)return;const a=button.dataset.action;
 if(a==='source'){showSource(button.dataset.source);return}if(a==='close-source'){document.getElementById('source-dialog').close();return}
 if(a==='layout'){state.layout=button.dataset.layout;state.page='ticker'}
 if(a==='page'){state.scan=button.dataset.page;state.page=button.dataset.page}
 if(a==='ticker')chooseTicker(button.dataset.ticker);
 if(a==='back'&&state.layout==='split'){document.querySelector('.scan-panel').scrollIntoView({behavior:'smooth',block:'start'});return}if(a==='back')state.page=state.scan;
 if(a==='tab')state.tab=button.dataset.tab;
 if(a==='report-mode')state.reportMode=button.dataset.mode;
 if(a==='ownership-view')state.ownershipView=button.dataset.view;
 if(a==='market-filter')state.marketFilter=button.dataset.filter;
 if(a==='broker-toggle'){const code=button.dataset.code;state.brokerCodes=state.brokerCodes.includes(code)?state.brokerCodes.filter(c=>c!==code):[...state.brokerCodes,code]}
 if(a==='broker-clear')state.brokerCodes=[];
 if(a==='broker-sort'){if(state.brokerSort===button.dataset.sort)state.brokerDirection*=-1;else{state.brokerSort=button.dataset.sort;state.brokerDirection=state.brokerSort==='code'?1:-1}}
 if(a==='broker-coverage'){const pack=data.brokers[state.ticker];state.from=pack.from;state.through=pack.through;state.cursor=null}
 if(a==='sort'){if(state.stockSort===button.dataset.sort)state.stockDirection*=-1;else{state.stockSort=button.dataset.sort;state.stockDirection=1}}
 if(a==='cursor-date')state.cursor=selectedRows().findIndex(r=>r.date===button.dataset.date);
 render();
}
function change(event){
 const target=event.target,field=target.dataset.field;if(!field||field==='stockQuery')return;
 if(field==='from'||field==='through'){if(!target.value||!target.checkValidity())return;state[field]=target.value;state.cursor=null}
 else if(field==='cursor')state.cursor=Number(target.value);
 else if(field==='compare'||field==='brokerSelectedOnly')state[field]=target.checked;
 else if(field==='preset'){if(target.value==='custom')return;const rows=detail().prices.filter(r=>r.date<=state.through);state.from=target.value==='all'?rows[0].date:rows[Math.max(0,rows.length-Number(target.value))].date;state.cursor=null}
 else state[field]=target.value;
 render();
}
function search(event){const field=event.target.dataset.field;if(!['stockQuery','brokerSearch'].includes(field))return;const position=event.target.selectionStart;state[field]=event.target.value;render();const target=document.querySelector('[data-field="'+field+'"]');target.focus();target.setSelectionRange(position,position)}
function keyboard(event){if(document.getElementById('source-dialog').open||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||event.metaKey||event.ctrlKey||event.altKey)return;if(['1','2','3','4'].includes(event.key)){chooseTicker(symbols[Number(event.key)-1]);render()}}
function bind(){document.addEventListener('click',action);document.addEventListener('change',change);document.addEventListener('input',search);document.addEventListener('keydown',keyboard)}
async function start(){
 const bytes=Uint8Array.from(atob('__BROKERS_GZIP__'),c=>c.charCodeAt(0));
 data.brokers=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
 bind();render();document.dispatchEvent(new Event('prototype-ready'));
}
start();
</script></body></html>
