[project]
name = "vibe-idx"
version = "0.1.0"
description = "IDX ingestion for market data and ownership disclosures"
requires-python = ">=3.12"
dependencies = [
  "curl-cffi>=0.11",
  "pdfplumber>=0.11",
  "pypdf>=5",
  "tenacity>=8.2",
  "typer>=0.12",
]

[project.scripts]
idx-ingest = "idx_ingest.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]
