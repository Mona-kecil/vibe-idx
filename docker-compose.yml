services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "@vibe-idx/web", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VIBE_IDX_API_PROXY_TARGET: http://api:20240
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "@vibe-idx/web", "server"]
    environment:
      VIBE_IDX_API_HOST: 0.0.0.0
      VIBE_IDX_API_PORT: "20240"
      VIBE_IDX_DATABASE_URL: sqlite:////data/vibe_idx.sqlite
    ports:
      - "20240:20240"
    volumes:
      - vibe-idx-data:/data

  ingest:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
      target: ingest
    profiles:
      - tools
    environment:
      VIBE_IDX_DATABASE_URL: sqlite:////data/vibe_idx.sqlite
      VIBE_IDX_RAW_DIR: /data/raw
    volumes:
      - vibe-idx-data:/data

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: app
    profiles:
      - prod
    environment:
      VIBE_IDX_API_HOST: 0.0.0.0
      VIBE_IDX_API_PORT: "8080"
      VIBE_IDX_DATABASE_URL: sqlite:////data/vibe_idx.sqlite
    ports:
      - "8080:8080"
    volumes:
      - vibe-idx-data:/data

  scheduler:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
      target: scheduler
    profiles:
      - prod
    entrypoint: ["supercronic"]
    command: ["/etc/vibe-idx/ingest.cron"]
    environment:
      TZ: Asia/Jakarta
      VIBE_IDX_DATABASE_URL: sqlite:////data/vibe_idx.sqlite
      VIBE_IDX_RAW_DIR: /data/raw
    volumes:
      - vibe-idx-data:/data

volumes:
  vibe-idx-data:
    name: vibe-idx-data
