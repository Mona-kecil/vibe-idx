services:
  ingest:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
      target: ingest
    profiles:
      - prod
    environment:
      VIBE_IDX_BACKUP_DIR: /backups
      VIBE_IDX_DATABASE_URL: sqlite:////data/vibe_idx.sqlite
      VIBE_IDX_RAW_DIR: /data/raw
    volumes:
      - vibe-idx-data:/data
      - ./backups:/backups

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: app
    profiles:
      - prod
    environment:
      VIBE_IDX_API_HOST: 0.0.0.0
      VIBE_IDX_API_PORT: "8080"
      VIBE_IDX_BACKUP_DIR: /backups
      VIBE_IDX_DATABASE_URL: sqlite:////data/vibe_idx.sqlite
    ports:
      - "8080:8080"
    volumes:
      - vibe-idx-data:/data
      - ./backups:/backups

  scheduler:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
      target: scheduler
    profiles:
      - prod
    environment:
      TZ: Asia/Jakarta
      VIBE_IDX_BACKUP_DIR: /backups
      VIBE_IDX_DATABASE_URL: sqlite:////data/vibe_idx.sqlite
      VIBE_IDX_RAW_DIR: /data/raw
    volumes:
      - vibe-idx-data:/data
      - ./backups:/backups

volumes:
  vibe-idx-data:
    name: vibe-idx-data
