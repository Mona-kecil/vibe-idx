name: Daily IDX batch

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

concurrency:
  group: idx-batch-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      DATA: /tmp/idx-data
      OUT: /tmp/idx-public
      PRIVATE_OUT: /tmp/idx-private
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Parquet ledger
        run: mkdir -p "$DATA/raw" && aws s3 sync s3://vibe-idx-private/parquet "$DATA/parquet" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - name: Restore IDX raw responses
        run: aws s3 sync s3://vibe-idx-private/raw "$DATA/raw" --exclude "broker/*" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - name: Ingest IDX and emit website JSON
        run: pnpm --filter @vibe-idx/pipeline ingest -- --data "$DATA" --out "$OUT"
      - name: Archive raw responses
        if: always()
        run: |
          if [ -d "$DATA/raw" ]; then
            aws s3 sync "$DATA/raw" s3://vibe-idx-private/raw --no-overwrite --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
      - name: Upload Parquet ledger
        if: always()
        run: |
          if [ -d "$DATA/parquet" ]; then
            aws s3 sync "$DATA/parquet" s3://vibe-idx-private/parquet --exclude "*.tmp" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
      - name: Publish website JSON
        run: aws s3 sync "$OUT" s3://vibe-idx-public --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - name: Restore Stockbit token
        run: aws s3 cp s3://vibe-idx-private/auth/stockbit.json "$DATA/stockbit.json" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - name: Ingest private broker summaries
        run: pnpm --filter @vibe-idx/pipeline brokers -- --data "$DATA" --token "$DATA/stockbit.json" --out "$PRIVATE_OUT"
      - name: Save Stockbit token
        if: always()
        run: |
          if [ -f "$DATA/stockbit.json" ]; then
            aws s3 cp "$DATA/stockbit.json" s3://vibe-idx-private/auth/stockbit.json --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
      - name: Archive broker raw responses
        if: always()
        run: |
          if [ -d "$DATA/raw/broker" ]; then
            aws s3 sync "$DATA/raw/broker" s3://vibe-idx-private/raw/broker --no-overwrite --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
      - name: Upload broker Parquet ledger
        if: always()
        run: |
          if [ -d "$DATA/parquet/brokers" ]; then
            aws s3 sync "$DATA/parquet/brokers" s3://vibe-idx-private/parquet/brokers --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
          if [ -f "$DATA/parquet/broker-coverage.parquet" ]; then
            aws s3 cp "$DATA/parquet/broker-coverage.parquet" s3://vibe-idx-private/parquet/broker-coverage.parquet --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
      - name: Upload private broker JSON
        if: always()
        run: |
          if [ -d "$PRIVATE_OUT" ]; then
            aws s3 sync "$PRIVATE_OUT" s3://vibe-idx-private/site/ --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
