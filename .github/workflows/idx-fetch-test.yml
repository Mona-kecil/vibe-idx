name: IDX Fetch Test

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: IDX disclosure keyword
        required: true
        default: laporan kepemilikan
      date_from:
        description: Date from, YYYYMMDD
        required: true
        default: '20260601'
      date_to:
        description: Date to, YYYYMMDD
        required: true
        default: '20260612'
      page_size:
        description: Page size
        required: true
        default: '5'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Build URL
        id: url
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, urllib.parse
          params = {
              "kodeEmiten": "",
              "emitenType": "*",
              "indexFrom": 0,
              "pageSize": os.environ["PAGE_SIZE"],
              "dateFrom": os.environ["DATE_FROM"],
              "dateTo": os.environ["DATE_TO"],
              "lang": "id",
              "keyword": os.environ["KEYWORD"],
          }
          print("url=https://www.idx.co.id/primary/ListedCompany/GetAnnouncement?" + urllib.parse.urlencode(params))
          PY
        env:
          KEYWORD: ${{ inputs.keyword }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          PAGE_SIZE: ${{ inputs.page_size }}

      - name: Fetch IDX endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L \
            -D response-headers.txt \
            -o response-body.txt \
            -w 'http_code=%{http_code}\nremote_ip=%{remote_ip}\ncontent_type=%{content_type}\nsize_download=%{size_download}\n' \
            '${{ steps.url.outputs.url }}' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Accept-Language: id-ID,id;q=0.9,en-US;q=0.8,en;q=0.7' \
            -H 'Referer: https://www.idx.co.id/id/perusahaan-tercatat/keterbukaan-informasi/' \
            -H 'Origin: https://www.idx.co.id' | tee curl-summary.txt

          echo '--- headers ---'
          sed -n '1,80p' response-headers.txt
          echo '--- body start ---'
          head -c 1000 response-body.txt
          echo

      - name: Parse JSON if available
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          body = open('response-body.txt', 'rb').read().decode('utf-8', 'replace')
          data = json.loads(body)
          print('ResultCount:', data.get('ResultCount'))
          print('Replies:', len(data.get('Replies') or []))
          for item in (data.get('Replies') or [])[:5]:
              p = item.get('pengumuman') or {}
              print(p.get('TglPengumuman'), p.get('Kode_Emiten'), p.get('JudulPengumuman'))
          PY

      - name: Upload response artifact
        uses: actions/upload-artifact@v4
        with:
          name: idx-fetch-response
          path: |
            curl-summary.txt
            response-headers.txt
            response-body.txt
