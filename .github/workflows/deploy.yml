name: Deploy Worker

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the $TARGET deploy"
            echo present=false >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        run: pnpm --filter @vibe-idx/web ${{ env.TARGET == 'production' && 'build' || 'build:preview' }}
      - if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.R2_ACCOUNT_ID }}
          wranglerVersion: 4.163.0
          workingDirectory: apps/web
          environment: ${{ env.TARGET == 'preview' && 'preview' || '' }}
          command: deploy
